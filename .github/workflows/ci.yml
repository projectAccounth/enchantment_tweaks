name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: windows-latest
            cc: cl
            cxx: cl
          - os: macos-latest
            cc: clang
            cxx: clang++

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config \
            libgtk-3-dev libcurl4-openssl-dev libzip-dev libfreetype6-dev libgl1-mesa-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libglfw3-dev

      - name: Build SDL3 (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --depth 1 --branch release-3.2.20 \
            https://github.com/libsdl-org/SDL.git "$RUNNER_TEMP/SDL"
          cmake -S "$RUNNER_TEMP/SDL" -B "$RUNNER_TEMP/SDL-build" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/SDL-install" \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build "$RUNNER_TEMP/SDL-build" --parallel 8
          cmake --install "$RUNNER_TEMP/SDL-build"
          echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/SDL-install" >> "$GITHUB_ENV"

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja pkg-config curl libzip freetype glfw sdl3

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake ninja pkgconfiglite -y
          vcpkg install curl libzip freetype glfw3 sdl3 --triplet x64-windows

      - name: Configure (Native)
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -B build_native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"
          elif [ "$RUNNER_OS" == "Linux" ]; then
            cmake -B build_native -G Ninja -DCMAKE_BUILD_TYPE=Debug -DENCHANTMENT_TWEAKS_ENABLE_COVERAGE=ON
          else
            cmake -B build_native -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build (Native)
        run: |
          cmake --build build_native -j4

      - name: Run Tests
        working-directory: build_native/tests
        shell: bash
        run: |
          ctest --output-on-failure

      - name: Generate coverage report
        if: runner.os == 'Linux' && always()
        run: |
          mkdir -p coverage
          gcovr --root "$GITHUB_WORKSPACE" \
            --object-directory build_native \
            --filter "$GITHUB_WORKSPACE/src/core/" \
            --filter "$GITHUB_WORKSPACE/include/core/" \
            --txt-summary \
            --html-details coverage/index.html \
            | tee coverage/summary.txt
          {
            echo "## Test coverage"
            echo '```text'
            cat coverage/summary.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload native binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enchantment-tweaks-${{ matrix.os }}
          path: build_native/bin/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: |
            build_native/tests/Testing/
            coverage/
          if-no-files-found: ignore

  build-wasm:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "latest"

      - name: Verify Emscripten
        run: |
          emcc --version
          emcmake cmake --version

      - name: Configure (WASM)
        run: |
          emcmake cmake -B build_wasm -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build (WASM)
        run: |
          cmake --build build_wasm -j4

      - name: Upload WASM artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-artifacts
          path: |
            build_wasm/*.js
            build_wasm/*.wasm
            build_wasm/apps/wasm/*
          if-no-files-found: ignore
